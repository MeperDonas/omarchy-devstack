name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck python3

      - name: ShellCheck
        run: shellcheck --severity=warning bin/devstack install.sh uninstall.sh

      - name: bash syntax
        run: |
          for f in bin/devstack install.sh uninstall.sh; do bash -n "$f"; done

      - name: Manifest is a valid plugin manifest
        run: |
          jq -e '.schemaVersion == 1' manifest.json >/dev/null
          jq -e '.kinds == ["bar-widget"]' manifest.json >/dev/null
          jq -e '.entryPoints.barWidget' manifest.json >/dev/null
          jq -e '.barWidget.schema | length > 0' manifest.json >/dev/null
          entry=$(jq -r '.entryPoints.barWidget' manifest.json)
          test -f "$entry" || { echo "missing entry point: $entry"; exit 1; }
          # every schema default must exist under defaults so the widget can read it
          for key in $(jq -r '.barWidget.schema[].key' manifest.json); do
            jq -e --arg k "$key" '.barWidget.defaults | has($k)' manifest.json >/dev/null \
              || { echo "schema key without default: $key"; exit 1; }
          done

      - name: Config files are valid JSON
        run: for f in config/*.json; do jq -e . "$f" >/dev/null || exit 1; done

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq python3

      - name: CLI lifts, reports and drops a real stack
        run: |
          set -euo pipefail
          export DEVDATA_CONFIG="$PWD/config"
          export DEVDATA_PROJECT=demo
          bin/devstack demo up
          bin/devstack demo --up
          bin/devstack demo --running
          bin/devstack json | jq -e '.project == "demo" and (.services | length == 1) and .services[0].id == "web"'
          bin/devstack status
          bin/devstack list
          bin/devstack down
          if bin/devstack demo --up; then
            echo "the port should be closed after down"; exit 1
          fi

      - name: Bare command without a project uses the default
        run: |
          set -euo pipefail
          export DEVDATA_CONFIG="$PWD/config"
          export DEVDATA_PROJECT=demo
          bin/devstack json | jq -e '.project == "demo"'
          bin/devstack list >/dev/null

      - name: Menu block is valid JSONC
        run: |
          set -euo pipefail
          export DEVDATA_CONFIG="$PWD/config"
          { echo "{"; bin/devstack demo menu; echo "}"; } > /tmp/menu.jsonc
          python3 scripts/jsonc-check.py /tmp/menu.jsonc > /tmp/menu.json
          jq -e 'has("dev.demo.up")' /tmp/menu.json > /dev/null
          jq -e '.["dev.demo.up"].action | contains("omarchy-launch-terminal")' /tmp/menu.json > /dev/null
          jq -e 'length > 5' /tmp/menu.json > /dev/null
          jq -r '"menu block ok: \(length) rows"' /tmp/menu.json
